name: Publish

# Runs when a version tag is pushed (`npm run release` does that). The tag must match package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance: the package says which commit and workflow built it

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
